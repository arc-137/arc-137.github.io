<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArcRes has moved</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 "Segoe UI", system-ui, sans-serif; background: #2e1c47; color: #fff; padding: 16px; box-sizing: border-box; }
  main { max-width: 460px; background: #3b2659; border-radius: 16px; padding: 28px 26px; border-top: 4px solid #2ec4b6; }
  h1 { margin: 0 0 8px; font-size: 24px; }
  p { margin: 8px 0; color: #e6dcf3; }
  a.btn { display: inline-block; margin-top: 12px; background: #2ec4b6; color: #1c1230; font-weight: 700; text-decoration: none; padding: 10px 18px; border-radius: 10px; }
  small { display: block; margin-top: 18px; color: #b9a8d3; }
  small a { color: #7ae0d6; }
</style></head>
<body><main>
  <h1>ArcRes has moved</h1>
  <p>ArcRes now needs a sign-in. If you've been given access, sign in with your email at its new address: you'll get a code by email.</p>
  <a class="btn" href="https://arc-137.pages.dev/res/">Open ArcRes</a>
  <p>On an iPad, open it there and use Share → Add to Home Screen again.</p>
  <small>The <a href="/help/user-guide.html">user guide</a> and <a href="/help/videos.html">tutorial videos</a> are still here.</small>
</main>
<script>if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));</script>
</body></html>
